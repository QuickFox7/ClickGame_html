<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Watermelon Collision Test</title>

<style>

body{
    margin:0;
    background:#ddd;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
}

#container{
    position:relative;
    width:900px;
    height:600px;
    background:#f6f6f6;
    border:1px solid #999;
}

#watermelon{
    position:absolute;
    left:250px;
    top:150px;
    width:400px;
}

canvas{
    position:absolute;
    inset:0;
}

#panel{
    position:absolute;
    left:15px;
    top:15px;

    background:white;
    padding:12px;

    border-radius:8px;
    box-shadow:0 0 8px rgba(0,0,0,.2);

    width:220px;
}

.row{
    margin-bottom:14px;
}

input[type=range]{
    width:100%;
}

.value{
    font-weight:bold;
    color:#0060ff;
}

</style>
</head>

<body>

<div id="container">

    <img id="watermelon" src="../watermelon.png">

    <canvas id="canvas"></canvas>

    <div id="panel">

        <div class="row">

            rxScale

            <input
                id="rxSlider"
                type="range"
                min="0.20"
                max="0.60"
                step="0.01"
                value="0.42">

            <div class="value" id="rxValue"></div>

        </div>

        <div class="row">

            ryScale

            <input
                id="rySlider"
                type="range"
                min="0.20"
                max="0.60"
                step="0.01"
                value="0.40">

            <div class="value" id="ryValue"></div>

        </div>

        <div id="result"></div>

    </div>

</div>

<script>

const container = document.getElementById("container");
const watermelon = document.getElementById("watermelon");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = container.clientWidth;
canvas.height = container.clientHeight;

const rxSlider = document.getElementById("rxSlider");
const rySlider = document.getElementById("rySlider");

const rxValue = document.getElementById("rxValue");
const ryValue = document.getElementById("ryValue");

const result = document.getElementById("result");

let mouseX = 0;
let mouseY = 0;

container.addEventListener("mousemove",e=>{

    const r = container.getBoundingClientRect();

    mouseX = e.clientX-r.left;
    mouseY = e.clientY-r.top;

    draw();

});

rxSlider.oninput = draw;
rySlider.oninput = draw;

window.onresize=()=>{

    canvas.width=container.clientWidth;
    canvas.height=container.clientHeight;

    draw();

}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const rect=watermelon.getBoundingClientRect();
    const base=container.getBoundingClientRect();

    const left=rect.left-base.left;
    const top=rect.top-base.top;

    const centerX=left+rect.width/2;
    const centerY=top+rect.height/2;

    const rxScale=Number(rxSlider.value);
    const ryScale=Number(rySlider.value);

    const rx=rect.width*rxScale;
    const ry=rect.height*ryScale;

    const dx=mouseX-centerX;
    const dy=mouseY-centerY;

    const inside=
        (dx*dx)/(rx*rx)+
        (dy*dy)/(ry*ry)<=1;

    ctx.beginPath();

    ctx.strokeStyle=
        inside?"lime":"red";

    ctx.lineWidth=3;

    ctx.ellipse(
        centerX,
        centerY,
        rx,
        ry,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    ctx.beginPath();
    ctx.fillStyle="dodgerblue";
    ctx.arc(centerX,centerY,4,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle=
        inside?"lime":"red";
    ctx.arc(mouseX,mouseY,6,0,Math.PI*2);
    ctx.fill();

    rxValue.textContent=rxScale.toFixed(2);
    ryValue.textContent=ryScale.toFixed(2);

    result.innerHTML=
        inside
        ?"<span style='color:green'>判定：ON</span>"
        :"<span style='color:red'>判定：OFF</span>";

}

watermelon.onload=draw;

</script>

</body>
</html>
