<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スイカ 🍉</title>
<style>
  :root {
    /* 少し赤い、透明感のある水の色 */
    --drop-color: 255, 70, 90;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 35%, #fdeef0 0%, #f6dfe3 45%, #e9c9cf 100%);
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-user-drag: none;
  }

  /* しずくが落ちる先の床（うっすら反射） */
  body::after {
    content: "";
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 22%;
    background: linear-gradient(to top, rgba(233,201,207,.6), transparent);
    pointer-events: none;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 水しぶき/しずくを描くレイヤー（画像より背面） */
  #fx {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .watermelon-wrap {
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 25px 30px rgba(120, 20, 40, .25));
    animation: floaty 5s ease-in-out infinite;
    will-change: transform;
  }

  .watermelon-wrap img {
    display: block;
    width: min(46vw, 460px);
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-.4deg); }
    50%      { transform: translateY(-12px) rotate(.4deg); }
  }

  .hint {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    color: #b23a4c;
    font-size: 14px;
    letter-spacing: .08em;
    opacity: .75;
    pointer-events: none;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:.85} }
</style>
</head>
<body>
  <canvas id="fx"></canvas>

  <div class="stage">
    <div class="watermelon-wrap" id="melon">
      <img src="../スイカと皿.png" alt="スイカ">
    </div>
  </div>

  <p class="hint">スイカをクリック / タップで かぶりつく 🍉💦</p>

<script>
(() => {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  const melon = document.getElementById('melon');

  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const GRAV = 0.35;
  const COLOR = [255, 70, 90]; // 少し赤い水

  const particles = [];

  // 汁のしずく（縦に伸びた透明感のある粒）
  class Drop {
    constructor(x, y, vx, vy, r) {
      this.x = x; this.y = y;
      this.vx = vx; this.vy = vy;
      this.r = r;
      this.life = 1;
      this.landed = false;
    }
    update() {
      this.vy += GRAV;
      this.x += this.vx;
      this.y += this.vy;
      // 床あたりで はじけて 小さなしぶきに
      if (!this.landed && this.y > H * 0.9) {
        this.landed = true;
        this.life = 0;
        splash(this.x, this.y, 6, 1.4);
      }
      if (this.y > H + 40) this.life = 0;
    }
    draw() {
      const speed = Math.min(Math.hypot(this.vx, this.vy), 18);
      const stretch = 1 + speed * 0.12;
      ctx.save();
      ctx.translate(this.x, this.y);
      const a = Math.atan2(this.vy, this.vx) - Math.PI / 2;
      ctx.rotate(a);
      ctx.scale(1, stretch);
      // 透明感：中心は明るく、縁は赤く
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, this.r);
      g.addColorStop(0,   `rgba(255,190,200,0.9)`);
      g.addColorStop(0.5, `rgba(${COLOR[0]},${COLOR[1]},${COLOR[2]},0.55)`);
      g.addColorStop(1,   `rgba(${COLOR[0]},${COLOR[1]},${COLOR[2]},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, this.r, 0, Math.PI * 2);
      ctx.fill();
      // ハイライト
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath();
      ctx.arc(-this.r * 0.25, -this.r * 0.3, this.r * 0.28, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // 細かいしぶきの粒
  class Speck {
    constructor(x, y, vx, vy, r) {
      this.x = x; this.y = y;
      this.vx = vx; this.vy = vy;
      this.r = r;
      this.life = 1;
      this.decay = 0.012 + Math.random() * 0.02;
    }
    update() {
      this.vy += GRAV * 0.8;
      this.x += this.vx;
      this.y += this.vy;
      this.vx *= 0.99;
      this.life -= this.decay;
    }
    draw() {
      const radius = this.r * this.life;
      if (radius <= 0) return;

      ctx.beginPath();
      ctx.fillStyle =
        `rgba(${COLOR[0]},${COLOR[1]},${COLOR[2]},${this.life * 0.75})`;
      ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function splash(x, y, count, power) {
    for (let i = 0; i < count; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1;
      const sp = (2 + Math.random() * 4) * power;
      particles.push(new Speck(
        x, y,
        Math.cos(ang) * sp,
        Math.sin(ang) * sp - 1,
        1 + Math.random() * 2.5
      ));
    }
  }

  // スイカの下端あたりから しずくが生まれる位置を求める
  function dripOrigin() {
    const rect = melon.getBoundingClientRect();
    // スイカの果肉あたり（下寄り・中央付近）から
    const x = rect.left + rect.width * (0.25 + Math.random() * 0.5);
    const y = rect.top + rect.height * (0.72 + Math.random() * 0.12);
    return { x, y };
  }

  // 定期的に したたる汁
  function autoDrip() {
    if (particles.length < 140 && Math.random() < 0.9) {
      const { x, y } = dripOrigin();
      particles.push(new Drop(
        x, y,
        (Math.random() - 0.5) * 0.6,
        0.5 + Math.random() * 1.2,
        3 + Math.random() * 3
      ));
    }
    setTimeout(autoDrip, 260 + Math.random() * 380);
  }
  autoDrip();

  // クリック＝かぶりつく：大きな水しぶき
  function bite() {
    const rect = melon.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.55;

    // 勢いのあるしぶき
    for (let i = 0; i < 60; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.4;
      const sp = 3 + Math.random() * 10;
      particles.push(new Speck(
        cx + (Math.random() - 0.5) * rect.width * 0.4,
        cy + (Math.random() - 0.5) * rect.height * 0.2,
        Math.cos(ang) * sp,
        Math.sin(ang) * sp,
        1.5 + Math.random() * 3
      ));
    }
    // 飛び散る大粒のしずく
    for (let i = 0; i < 14; i++) {
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.2;
      const sp = 4 + Math.random() * 9;
      particles.push(new Drop(
        cx + (Math.random() - 0.5) * rect.width * 0.3,
        cy,
        Math.cos(ang) * sp,
        Math.sin(ang) * sp,
        3 + Math.random() * 3
      ));
    }

    // かじった反動
    melon.animate([
      { transform: 'scale(1)' },
      { transform: 'scale(0.94) rotate(-1deg)' },
      { transform: 'scale(1.02)' },
      { transform: 'scale(1)' }
    ], { duration: 420, easing: 'ease-out' });
  }
  window.addEventListener('pointerdown', bite);

  function loop() {
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.update();

      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }

      p.draw();
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
